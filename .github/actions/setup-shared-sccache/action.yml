name: setup-shared-sccache
description: Configure persistent Rust compilation caching and long-build diagnostics.

runs:
  using: composite
  steps:
    - name: Install pinned sccache
      uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
      with:
        tool: sccache@0.18.0

    # Runtime cache credentials are available to JavaScript actions, not ordinary
    # shell steps. Select the v2 protocol as well as its results endpoint;
    # otherwise OpenDAL sends obsolete /_apis/artifactcache requests there.
    - name: Export GitHub cache runtime
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
            const value = process.env[name];
            if (!value) {
              throw new Error(`${name} is unavailable; refusing an unpersisted release cache`);
            }
            core.setSecret(value);
            core.exportVariable(name, value);
          }
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
          core.exportVariable('SCCACHE_GHA_ENABLED', 'true');

    - name: Configure cache and diagnostics
      shell: bash
      run: |
        set -euo pipefail
        diagnostics="${RUNNER_TEMP}/release-diagnostics"
        mkdir -p "$diagnostics"
        {
          echo "RUSTC_WRAPPER=$(command -v sccache)"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "SCCACHE_ERROR_LOG=${diagnostics}/sccache.log"
          echo "SCCACHE_LOG=warn"
          echo "RELEASE_DIAGNOSTICS_DIR=${diagnostics}"
        } >> "$GITHUB_ENV"

    - name: Start persistent cache backend
      shell: bash
      run: |
        set -euo pipefail
        sccache --start-server
        sccache --zero-stats
        sccache --show-stats

    - name: Verify persistent cache round trip before compiling the workspace
      shell: bash
      run: |
        set -euo pipefail
        probe="$(mktemp -d "${RUNNER_TEMP}/sccache-probe.XXXXXX")"
        printf 'pub fn cache_probe() -> u8 { 42 }\n' > "$probe/probe.rs"
        sccache rustc --crate-name codex_ci_cache_probe --crate-type rlib \
          --emit dep-info,link --out-dir "$probe" "$probe/probe.rs"
        sccache --stop-server
        sccache --start-server
        sccache --zero-stats
        sccache rustc --crate-name codex_ci_cache_probe --crate-type rlib \
          --emit dep-info,link --out-dir "$probe" "$probe/probe.rs"
        sccache --show-stats | tee "${RELEASE_DIAGNOSTICS_DIR}/cache-probe.txt"
        grep -Eq '^Cache hits[[:space:]]+[1-9][0-9]*[[:space:]]*$' \
          "${RELEASE_DIAGNOSTICS_DIR}/cache-probe.txt"
        grep -Eq '^Cache write errors[[:space:]]+0[[:space:]]*$' \
          "${RELEASE_DIAGNOSTICS_DIR}/cache-probe.txt"
        sccache --zero-stats
        echo "Rust compilation cache: verified GitHub Actions v2 round trip across a server restart"
