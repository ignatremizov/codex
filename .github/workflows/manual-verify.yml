name: manual-verify

on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Optional nextest filter expression for a targeted diagnostic run
        required: false
        type: string
      nextest_packages:
        description: Optional comma-separated Cargo packages; skips workspace Clippy and cleanup
        required: false
        type: string
      regenerate_app_server_schema:
        description: Regenerate and upload app-server schema fixtures before running tests
        required: false
        default: false
        type: boolean
      regenerate_config_schema:
        description: Regenerate and upload the config schema fixture before running tests
        required: false
        default: false
        type: boolean
      regenerate_bazel_lock:
        description: Regenerate and upload MODULE.bazel.lock before running Rust checks
        required: false
        default: false
        type: boolean
      regenerate_tui_snapshots:
        description: Regenerate and upload TUI snapshots selected by the nextest filter
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify regeneration (single runner)
    if: ${{ inputs.regenerate_app_server_schema || inputs.regenerate_config_schema || inputs.regenerate_bazel_lock || inputs.regenerate_tui_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      # Fork TUI and app-server integration futures retain more lifecycle state than upstream.
      RUST_MIN_STACK: "16777216"
      SCCACHE_CACHE_SIZE: 4G
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: ./.github/actions/setup-ci
        if: ${{ !inputs.regenerate_bazel_lock }}

      - name: Prepare Bazel CI
        if: inputs.regenerate_bazel_lock
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: manual-verify-lock

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-apt-packages.sh" \
            pkg-config libcap-dev libasound2-dev bubblewrap

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Refresh Cargo workspace versions
        id: refresh_cargo_workspace
        if: inputs.regenerate_bazel_lock
        # rules_rs matches workspace members by name and version. Refresh release
        # version changes while preserving already-locked external dependencies.
        run: cargo update --workspace

      - name: Regenerate Bazel module lockfile
        id: regenerate_bazel_lock
        if: inputs.regenerate_bazel_lock
        working-directory: ${{ github.workspace }}
        run: just bazel-lock-update

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: manual-verify-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            manual-verify-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-
            manual-verify-cargo-home-${{ runner.os }}-

      - name: Restore sccache cache
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/sccache
          key: manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-
            manual-verify-sccache-${{ runner.os }}-

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest

      - name: Enable unprivileged user namespaces (Linux)
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Configure sccache
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Install uv for generated Python SDK artifacts
        if: inputs.regenerate_app_server_schema
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Regenerate app-server schema fixtures
        id: regenerate_app_server_schema
        if: inputs.regenerate_app_server_schema
        run: |
          just write-app-server-schema
          just write-app-server-schema --experimental

      - name: Regenerate config schema fixture
        id: regenerate_config_schema
        if: inputs.regenerate_config_schema
        run: just write-config-schema

      - name: Prepare pinned voice SDK and runtime
        uses: ./.github/actions/setup-manual-voice
        with:
          target: x86_64-unknown-linux-gnu

      - name: cargo fmt --check
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: cargo clippy --workspace --tests
        if: inputs.nextest_packages == ''
        run: cargo clippy --workspace --tests --timings -- -D warnings

      - name: Clean debug artifacts before nextest
        if: inputs.nextest_packages == ''
        run: cargo clean --profile dev

      - name: Set up remote test env (Docker)
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=codex-remote-test-env
          source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
          echo "CODEX_TEST_ENVIRONMENT=${CODEX_TEST_ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_CODEX_PATH=${CODEX_TEST_REMOTE_CODEX_PATH}" >> "$GITHUB_ENV"

      - name: cargo nextest run
        id: regenerate_snapshots
        env:
          CARGO_PROFILE_CI_TEST_DEBUG: "0"
          # Retain mismatches for review without accepting them or hiding test failures.
          INSTA_UPDATE: "new"
          NEXTEST_FILTER: ${{ inputs.nextest_filter }}
          NEXTEST_PACKAGES: ${{ inputs.nextest_packages }}
          REGENERATE_TUI_SNAPSHOTS: ${{ inputs.regenerate_tui_snapshots }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REGENERATE_TUI_SNAPSHOTS}" == "true" ]]; then
            export INSTA_UPDATE=always
          fi
          args=(run --no-fail-fast --cargo-profile ci-test --timings)
          if [[ -n "${NEXTEST_PACKAGES}" ]]; then
            IFS=',' read -ra packages <<< "${NEXTEST_PACKAGES}"
            for package in "${packages[@]}"; do
              if [[ ! "${package}" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "invalid Cargo package name: ${package}" >&2
                exit 2
              fi
              args+=(-p "${package}")
            done
          fi
          if [[ -z "${NEXTEST_PACKAGES}" || ",${NEXTEST_PACKAGES}," == *",codex-v8-poc,"* ]]; then
            args+=(--features codex-v8-poc/sandbox)
          fi
          if [[ -n "${NEXTEST_FILTER}" ]]; then
            args+=(-E "${NEXTEST_FILTER}")
          fi
          env -u CODEX_SANDBOX_NETWORK_DISABLED cargo nextest "${args[@]}"

      - name: Tear down remote test env
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CODEX_TEST_REMOTE_ENV:-}" ]]; then
            docker rm -f "${CODEX_TEST_REMOTE_ENV}" >/dev/null 2>&1 || true
          fi

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-manual-verify-${{ github.run_id }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload regenerated app-server schema fixtures
        if: always() && steps.regenerate_app_server_schema.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-server-schema-${{ github.run_id }}
          path: codex-rs/app-server-protocol/schema
          if-no-files-found: error
          retention-days: 14

      - name: Upload regenerated Python SDK artifacts
        if: always() && steps.regenerate_app_server_schema.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-sdk-generated-${{ github.run_id }}
          path: |
            sdk/python/src/openai_codex/generated/v2_all.py
            sdk/python/src/openai_codex/generated/notification_registry.py
            sdk/python/src/openai_codex/api.py
          if-no-files-found: error
          retention-days: 14

      - name: Upload regenerated Cargo and Bazel lockfiles
        if: always() && steps.refresh_cargo_workspace.outcome == 'success' && steps.regenerate_bazel_lock.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-module-lock-${{ github.run_id }}
          path: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload regenerated config schema fixture
        if: always() && steps.regenerate_config_schema.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: config-schema-${{ github.run_id }}
          path: codex-rs/core/config.schema.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload regenerated TUI snapshots
        if: always() && inputs.regenerate_tui_snapshots && steps.regenerate_snapshots.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tui-snapshots-${{ github.run_id }}
          path: codex-rs/tui/**/*.snap
          if-no-files-found: error
          retention-days: 14

      - name: Upload nextest JUnit report
        if: always() && steps.regenerate_snapshots.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-junit-manual-verify-${{ github.run_id }}
          # nextest's default store is workspace-relative, not CARGO_TARGET_DIR-relative.
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pending snapshots
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pending-snapshots-${{ github.run_id }}
          path: codex-rs/**/*.snap.new
          if-no-files-found: ignore
          retention-days: 14

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: manual-verify-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/sccache
          key: manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}

  static:
    if: ${{ !inputs.regenerate_app_server_schema && !inputs.regenerate_config_schema && !inputs.regenerate_bazel_lock && !inputs.regenerate_tui_snapshots }}
    uses: ./.github/workflows/rust-static-checks.yml
    with:
      run_clippy: ${{ inputs.nextest_packages == '' }}

  archive:
    name: Build nextest archive
    if: ${{ !inputs.regenerate_app_server_schema && !inputs.regenerate_config_schema && !inputs.regenerate_bazel_lock && !inputs.regenerate_tui_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      SCCACHE_CACHE_SIZE: 10G
      NEXTEST_ARCHIVE_FILE: nextest-manual-verify-${{ github.run_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-manual-verify-${{ github.run_id }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet
          docker system prune -af >/dev/null 2>&1 || true

      - uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-apt-packages.sh" \
            pkg-config libcap-dev libasound2-dev bubblewrap

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: manual-rust-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            manual-rust-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-
            manual-rust-cargo-home-${{ runner.os }}-

      - name: Restore ci-test sccache cache
        id: cache_ci_test_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/sccache
          key: manual-rust-ci-test-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}
          restore-keys: |
            manual-rust-ci-test-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-
            manual-verify-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-
            manual-verify-sccache-${{ runner.os }}-

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest

      - name: Configure persistent ci-test sccache
        shell: bash
        run: |
          set -euo pipefail
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"

      - name: Prepare pinned voice SDK and runtime
        uses: ./.github/actions/setup-manual-voice
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build nextest archive
        env:
          CARGO_PROFILE_CI_TEST_DEBUG: "0"
          NEXTEST_PACKAGES: ${{ inputs.nextest_packages }}
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/nextest-archive"
          mkdir -p "${archive_dir}"
          args=(archive --cargo-profile ci-test --timings --archive-file "${archive_dir}/${NEXTEST_ARCHIVE_FILE}")
          if [[ -n "${NEXTEST_PACKAGES}" ]]; then
            IFS=',' read -ra packages <<< "${NEXTEST_PACKAGES}"
            for package in "${packages[@]}"; do
              if [[ ! "${package}" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "invalid Cargo package name: ${package}" >&2
                exit 2
              fi
              args+=(-p "${package}")
            done
          fi
          if [[ -z "${NEXTEST_PACKAGES}" || ",${NEXTEST_PACKAGES}," == *",codex-v8-poc,"* ]]; then
            args+=(--features codex-v8-poc/sandbox)
          fi
          env -u CODEX_SANDBOX_NETWORK_DISABLED cargo nextest "${args[@]}"

      - name: Build runtime test helpers
        env:
          CARGO_PROFILE_CI_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          mkdir -p "${helper_dir}"
          cargo build --profile ci-test -p codex-linux-sandbox --bin codex-linux-sandbox
          cargo build --profile ci-test -p codex-cli --bin codex
          cargo build --profile ci-test -p codex-code-mode-host --bin codex-code-mode-host
          cargo build --profile ci-test -p codex-voice-host --bin codex-voice-host
          test "$("${CARGO_TARGET_DIR}/ci-test/codex-voice-host" --build-commit)" = "$GITHUB_SHA"
          cp "${CARGO_TARGET_DIR}/ci-test/codex-linux-sandbox" "${helper_dir}/"
          cp "${CARGO_TARGET_DIR}/ci-test/codex" "${helper_dir}/"
          cp "${CARGO_TARGET_DIR}/ci-test/codex-code-mode-host" "${helper_dir}/"
          cp "${CARGO_TARGET_DIR}/ci-test/codex-voice-host" "${helper_dir}/"
          tar -C "${CARGO_TARGET_DIR}/voice-native" -czf "${helper_dir}/voice-runtime.tar.gz" link runtime

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-manual-verify-archive-${{ github.run_id }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload nextest archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-archive-manual-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-archive/${{ env.NEXTEST_ARCHIVE_FILE }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload runtime test helper
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: |
            ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/codex-linux-sandbox
            ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/codex
            ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/codex-code-mode-host
            ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/codex-voice-host
            ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/voice-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: manual-rust-cargo-home-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save ci-test sccache cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/sccache
          key: manual-rust-ci-test-sccache-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}-${{ github.run_id }}

  shard:
    name: Tests shard ${{ matrix.shard }}/4
    if: ${{ !inputs.regenerate_app_server_schema && !inputs.regenerate_config_schema && !inputs.regenerate_bazel_lock && !inputs.regenerate_tui_snapshots }}
    needs:
      - static
      - archive
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_MIN_STACK: "16777216"
      NEXTEST_ARCHIVE_FILE: nextest-manual-verify-${{ github.run_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-manual-verify-${{ github.run_id }}
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-apt-packages.sh" \
            pkg-config libcap-dev libasound2-dev bubblewrap

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest

      - name: Download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-manual-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Download runtime test helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}

      - name: Install runtime test helpers into archived target paths
        shell: bash
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          target_dir="${CARGO_TARGET_DIR}/ci-test"
          mkdir -p "${target_dir}"
          install -m 0755 \
            "${helper_dir}/codex-linux-sandbox" \
            "${target_dir}/codex-linux-sandbox"
          for binary in codex codex-code-mode-host codex-voice-host; do
            install -m 0755 "${helper_dir}/${binary}" "${target_dir}/${binary}"
            echo "CARGO_BIN_EXE_${binary}=${target_dir}/${binary}" >> "$GITHUB_ENV"
            echo "CARGO_BIN_EXE_${binary//-/_}=${target_dir}/${binary}" >> "$GITHUB_ENV"
          done
          voice_root="${CARGO_TARGET_DIR}/voice-native"
          mkdir -p "$voice_root"
          tar -xzf "${helper_dir}/voice-runtime.tar.gz" -C "$voice_root"
          test -f "$voice_root/runtime/runtime.json"
          echo "LD_LIBRARY_PATH=$voice_root/link/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_VOICE_RUNTIME=$voice_root/runtime" >> "$GITHUB_ENV"

      - name: Set up remote test env (Docker)
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME="codex-remote-test-env-${{ github.run_id }}-${{ matrix.shard }}"
          export CODEX_TEST_REMOTE_CODEX_BINARY="${CARGO_TARGET_DIR}/ci-test/codex"
          source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
          echo "CODEX_TEST_ENVIRONMENT=${CODEX_TEST_ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_CODEX_PATH=${CODEX_TEST_REMOTE_CODEX_PATH}" >> "$GITHUB_ENV"

      - name: Run nextest shard
        id: test
        env:
          # CI's default `auto` mode otherwise suppresses .snap.new files entirely.
          INSTA_UPDATE: "new"
          NEXTEST_FILTER: ${{ inputs.nextest_filter }}
          NEXTEST_STATUS_LEVEL: leak
        shell: bash
        run: |
          set -euo pipefail
          archive_file="${RUNNER_TEMP}/nextest-archive/${NEXTEST_ARCHIVE_FILE}"
          helper="${CARGO_TARGET_DIR}/ci-test/codex-linux-sandbox"
          args=(
            run
            --no-fail-fast
            --archive-file "${archive_file}"
            --workspace-remap "$(pwd)"
            --partition "hash:${{ matrix.shard }}/4"
          )
          if [[ -n "${NEXTEST_FILTER}" ]]; then
            args+=(-E "${NEXTEST_FILTER}")
          fi
          env \
            -u CODEX_SANDBOX_NETWORK_DISABLED \
            "CARGO_BIN_EXE_codex-linux-sandbox=${helper}" \
            "CARGO_BIN_EXE_codex_linux_sandbox=${helper}" \
            cargo nextest "${args[@]}"

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-junit-manual-verify-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pending snapshots
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pending-snapshots-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: codex-rs/**/*.snap.new
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down remote test env
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${STEPS_TEST_OUTCOME}" != "success" ]]; then
            docker logs "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" || true
          fi
          docker rm -f "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" >/dev/null 2>&1 || true
        env:
          STEPS_TEST_OUTCOME: ${{ steps.test.outcome }}

      - name: Verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed in shard ${{ matrix.shard }}/4."
          exit 1

  result:
    name: Verify result
    if: ${{ always() && !inputs.regenerate_app_server_schema && !inputs.regenerate_config_schema && !inputs.regenerate_bazel_lock && !inputs.regenerate_tui_snapshots }}
    needs:
      - static
      - shard
    runs-on: ubuntu-24.04
    steps:
      - name: Check all verification jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          echo "static=${STATIC_RESULT} shards=${SHARD_RESULT}"
          if [[ "${STATIC_RESULT}" != "success" || "${SHARD_RESULT}" != "success" ]]; then
            exit 1
          fi
